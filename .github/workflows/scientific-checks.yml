name: Finite scientific checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '41'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reproduce every finite evidence block with fail gates
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p scientific-output-logs
          ulimit -v 1048576
          ulimit -t 650
          timeout --signal=TERM --kill-after=5s 60s \
            python -B tests/regression_weight_lookup.py -v
          timeout --signal=TERM --kill-after=5s 570s \
            python -B reproduce.py --out scientific-output \
            2>&1 | tee scientific-output-logs/run.log
      - name: Retain raw outputs even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finite-scientific-outputs
          path: |
            scientific-output/**
            scientific-output-logs/**
          if-no-files-found: warn
          retention-days: 14
